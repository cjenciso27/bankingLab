[project]
name = "banking-lab"
version = "0.1.0"
description = "Secure Banking System laboratory"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
